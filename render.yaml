# render.yaml - Déploiement complet (API + Workers)
services:
  # Auth Backend
  - type: web
    name: zaksoft-auth-backend
    runtime: docker
    dockerfilePath: services/auth/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Design Backend (Web + Worker)
  - type: web
    name: zaksoft-design-backend
    runtime: docker
    dockerfilePath: services/design/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3003
      - key: REPLICATE_API_KEY
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # Video Backend (Web + Worker)
  - type: web
    name: zaksoft-video-backend
    runtime: docker
    dockerfilePath: services/video/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3002
      - key: RUNWAY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # WebGen Backend (Web + Worker)
  - type: web
    name: zaksoft-webgen-backend
    runtime: docker
    dockerfilePath: services/web-gen/Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 3004
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # PostgreSQL Database
  - type: postgres
    name: zaksoft-auth-db
    plan: free
