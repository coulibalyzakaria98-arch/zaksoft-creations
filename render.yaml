services:
  # --- Web Services ---
  
  - type: web
    name: zaksoft-auth-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd services/auth && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
        key: DATABASE_URL
      - key: CORS_ORIGINS
        value: https://zaksoft-creations.vercel.app

  - type: web
    name: zaksoft-billing-service
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd services/billing && pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
        key: DATABASE_URL

  # --- API Services (formerly workers) ---

  - type: web
    name: zaksoft-design-service
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd services/design && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
        key: DATABASE_URL
      - key: CORS_ORIGINS
        value: https://zaksoft-creations.vercel.app

  - type: web
    name: zaksoft-video-service
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd services/video && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
        key: DATABASE_URL
      - key: CORS_ORIGINS
        value: https://zaksoft-creations.vercel.app

  - type: web
    name: zaksoft-webgen-service
    env: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: cd services/web-gen && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
        key: DATABASE_URL
      - key: CORS_ORIGINS
        value: https://zaksoft-creations.vercel.app

databases:
  - name: zaksoft-auth-db
    region: frankfurt
    plan: free
