# render.yaml - Déploiement complet (API + Workers)
services:
  # Auth Backend
  - type: web
    name: zaksoft-auth-backend
    runtime: node
    buildCommand: pnpm install && pnpm --filter @zaksoft/database build && pnpm --filter @zaksoft/database db:push && pnpm --filter @zaksoft/auth build
    startCommand: pnpm --filter @zaksoft/auth start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Design Backend (Web + Worker)
  - type: web
    name: zaksoft-design-backend
    runtime: node
    buildCommand: pnpm install && pnpm --filter @zaksoft/database build && pnpm --filter @zaksoft/design build
    startCommand: pnpm --filter @zaksoft/design worker
    envVars:
      - key: PORT
        value: 3003
      - key: REPLICATE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # Video Backend (Web + Worker)
  - type: web
    name: zaksoft-video-backend
    runtime: node
    buildCommand: pnpm install && pnpm --filter @zaksoft/database build && pnpm --filter @zaksoft/video build
    startCommand: pnpm --filter @zaksoft/video worker
    envVars:
      - key: PORT
        value: 3002
      - key: RUNWAY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # WebGen Backend (Web + Worker)
  - type: web
    name: zaksoft-webgen-backend
    runtime: node
    buildCommand: pnpm install && pnpm --filter @zaksoft/database build && pnpm --filter @zaksoft/web-gen build
    startCommand: pnpm --filter @zaksoft/web-gen worker
    envVars:
      - key: PORT
        value: 3004
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # PostgreSQL Database
  - type: postgres
    name: zaksoft-auth-db
    plan: free
