# render.yaml - Déploiement complet (API + Workers)
services:
  # Auth Backend
  - type: web
    name: zaksoft-auth-backend
    runtime: node
    rootDir: services/auth
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # Design Worker (Images)
  - type: worker
    name: zaksoft-design-worker
    runtime: node
    rootDir: services/design
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: REPLICATE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # Video Worker
  - type: worker
    name: zaksoft-video-worker
    runtime: node
    rootDir: services/video
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: RUNWAY_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # WebGen Worker (Sites)
  - type: worker
    name: zaksoft-webgen-worker
    runtime: node
    rootDir: services/web-gen
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.js
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: zaksoft-auth-db
          property: connectionString

  # PostgreSQL Database
  - type: postgres
    name: zaksoft-auth-db
    plan: free
